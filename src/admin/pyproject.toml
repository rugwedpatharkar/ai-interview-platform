[project]
name = "admin"
version = "0.1.0"
description = "Admin service — API gateway, source of truth, funnel orchestration"
requires-python = ">=3.12"
dependencies = [
    "lib",
    "grpcio-tools>=1.60",
    "protobuf>=4",
    "pydantic>=2",
    "email-validator",
    "python-jose[cryptography]>=3",
    "pymongo>=4.13",
    "openpyxl>=3",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
