syntax = "proto3";

package admin.decision.v1;

// DecisionService — recruiter decision loop + gate override. Both advance the
// funnel through the single authority (app/resources/funnel). Manager-only.
service DecisionService {
  rpc DecideApplication(DecideRequest) returns (DecisionResponse);
  rpc OverrideGate(OverrideGateRequest) returns (DecisionResponse);
  rpc HoldApplication(HoldApplicationRequest) returns (HoldApplicationResponse);
  rpc RejectApplication(RejectApplicationRequest) returns (RejectApplicationResponse);
}

message DecideRequest {
  string application_id = 1;
  string outcome = 2;  // shortlisted | rejected | hired
}

message OverrideGateRequest {
  string application_id = 1;
}

message DecisionResponse {
  string application_id = 1;
  string state = 2;
}

message HoldApplicationRequest {
  string application_id = 1;
  string reason_code = 2;
  string free_text = 3;
}

message HoldApplicationResponse {
  string application_id = 1;
  string new_state = 2;
  int64 audited_at_ms = 3;
}

message RejectApplicationRequest {
  string application_id = 1;
  string reason_code = 2;
  string free_text = 3;
}

message RejectApplicationResponse {
  string application_id = 1;
  string new_state = 2;
  int64 audited_at_ms = 3;
}
