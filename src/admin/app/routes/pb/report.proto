syntax = "proto3";

package admin.report.v1;

// ReportService — recruiters read the AI-generated interview report for scored
// applications in their company. Read-only, manager-only, comp_id-scoped (via the
// application, the source of truth for tenant + funnel state).
service ReportService {
  rpc GetReport(GetReportRequest) returns (InterviewReport);
  rpc ListReports(ListReportsRequest) returns (ReportList);
  rpc ExportReports(ListReportsRequest) returns (ReportExport);
  // Recruiter integrity timeline — the first reader of proctoring_events (comp-scoped).
  rpc GetIntegrityTimeline(GetIntegrityTimelineRequest) returns (IntegrityTimeline);
}

message GetIntegrityTimelineRequest {
  string application_id = 1;
}

message ProctorFlag {
  string type = 1;                 // ProctoringEventType
  string severity = 2;             // "low" | "medium" | "high" (server-authoritative)
  string at = 3;                   // ISO timestamp
  map<string, string> meta = 4;    // small typed context (never raw media)
}

message IntegrityTimeline {
  int32 integrity_score = 1;       // weighted sum — higher = more concerning
  repeated ProctorFlag flags = 2;  // chronological
  string recording_url = 3;        // tenant-scoped playback URL; "" when none
  bool auto_terminated = 4;        // a HIGH-severity signal ended the interview
  string terminated_reason = 5;    // e.g. "second_face"; set iff auto_terminated
}

message GetReportRequest {
  string application_id = 1;
}

message ListReportsRequest {
  string job_id = 1;
}

message InterviewReport {
  string application_id = 1;
  string candidate_user_id = 2;
  string state = 3;  // application funnel state
  string executive_summary = 4;
  repeated string highlights = 5;
  repeated string risks = 6;
  double overall_score = 7;
  string recommendation = 8;
}

message ReportList {
  repeated InterviewReport reports = 1;
}

message ReportExport {
  string filename = 1;
  bytes content = 2;  // .xlsx workbook of scored candidates
}
