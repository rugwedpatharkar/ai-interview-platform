; Runs the 4 Python services + nginx in one container (Render free = 1 process group,
; 1 public port). Each program inherits the container env (MONGO_URI, REDIS_URL,
; RABBITMQ_URL, JWT_SECRET, GEMINI_API_KEY, CORS_ALLOW_ORIGIN, S3_*, OTLP_ENDPOINT,
; TRUSTED_PROXY, MCP_SHARED_SECRET, ...) from Render and adds only its own port /
; internal-URL overrides below. Logs go to the container's stdout/stderr so they show
; up in Render's log stream.
;
; Memory note: the four Python services idle at ~360 MB combined; on Render's 512 MB free
; instance that leaves ~130 MB headroom — fine for a demo, may OOM-restart under sustained
; multi-user load. Qdrant is intentionally absent (RAG/résumé-match degrades, nothing
; crashes — mcp-capability connects to Qdrant lazily).
;
; The voice-worker is off by default (adds ~90 MB and depends on LiveKit + Groq creds).
; Enable by setting VOICE_ENABLED=1 in the Render dashboard; the wrapper below no-ops
; when unset so the container boots identically in either mode.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

; Escalate a permanent program failure to a container exit — supervisord itself keeps
; running (nodaemon=true) even after all children go FATAL, which makes Render believe
; the container is healthy. This listener catches PROCESS_STATE_FATAL and kills
; supervisord with exit-code 3 so Render restarts the whole box.
[eventlistener:crash-escalator]
; Supervisord's eventlistener protocol requires READY *before* the first event is
; delivered. The previous version omitted the initial READY, blocked on the first
; `read`, and never fired — a permanent PROCESS_STATE_FATAL didn't exit the box.
command=bash -c 'echo READY; while read -r header; do read -r payload; echo RESULT 2; printf OK; kill 1; done'
events=PROCESS_STATE_FATAL
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:mcp-data]
command=python -m app.server
directory=/app/services/mcp-data
environment=MCP_PORT="8100"
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mcp-capability]
command=python -m app.server
directory=/app/services/mcp-capability
environment=MCP_PORT="8101"
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ai-agents]
command=python -m app.main
directory=/app/services/ai-agents
environment=HTTP_PORT="8081",MCP_DATA_URL="http://127.0.0.1:8100/mcp",MCP_CAPABILITY_URL="http://127.0.0.1:8101/mcp"
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:admin]
command=python -m app.main
directory=/app/services/admin
environment=HTTP_PORT="8080"
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Voice interview worker — off by default (unset VOICE_ENABLED = env-var default of 0).
; The wrapper sleeps forever when disabled so supervisord doesn't retry+FATAL a
; deliberately-off program (which would trigger the crash escalator above).
[program:voice-worker]
command=bash -lc 'if [ "$VOICE_ENABLED" = "1" ]; then exec python -m app.service.voice_worker; else echo "voice-worker disabled (set VOICE_ENABLED=1 to enable)"; exec sleep infinity; fi'
directory=/app/services/ai-agents
environment=VOICE_WORKER_HTTP_PORT="8090",MCP_DATA_URL="http://127.0.0.1:8100/mcp"
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
