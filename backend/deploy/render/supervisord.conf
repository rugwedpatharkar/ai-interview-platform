; Runs the 4 Python services + nginx in one container (Render free = 1 process group,
; 1 public port). Each program inherits the container env (MONGO_URI, REDIS_URL,
; RABBITMQ_URL, JWT_SECRET, GEMINI_API_KEY, CORS_ALLOW_ORIGIN, S3_*) from Render and adds
; only its own port / internal-URL overrides below. Logs go to the container's
; stdout/stderr so they show up in Render's log stream.
;
; Memory note: the four Python services idle at ~360 MB combined; on Render's 512 MB free
; instance that leaves ~130 MB headroom — fine for a demo, may OOM-restart under sustained
; multi-user load. Qdrant is intentionally absent (RAG/résumé-match degrades, nothing
; crashes — mcp-capability connects to Qdrant lazily).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

[program:mcp-data]
command=python -m app.server
directory=/app/services/mcp-data
environment=MCP_PORT="8100"
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mcp-capability]
command=python -m app.server
directory=/app/services/mcp-capability
environment=MCP_PORT="8101"
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ai-agents]
command=python -m app.main
directory=/app/services/ai-agents
environment=HTTP_PORT="8081",MCP_DATA_URL="http://127.0.0.1:8100/mcp",MCP_CAPABILITY_URL="http://127.0.0.1:8101/mcp"
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:admin]
command=python -m app.main
directory=/app/services/admin
environment=HTTP_PORT="8080"
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
