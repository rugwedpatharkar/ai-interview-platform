syntax = "proto3";

package admin.notification.v1;

// NotificationService — a recipient's notification feed + read-acks. Every RPC is
// recipient-scoped to the caller (caller_identity); no comp-scoping at the service.
service NotificationService {
  rpc ListNotifications(ListRequest) returns (ListResponse);
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  rpc MarkAllRead(MarkAllReadRequest) returns (MarkReadResponse);
}

message NotificationDTO {
  string id = 1;
  string kind = 2;
  string subject = 3;
  string body = 4;
  string link = 5;          // "" when absent
  string created_at = 6;    // ISO
  string read_at = 7;       // ISO; "" when unread
}

message ListRequest {
  int32 page = 1;
  int32 page_size = 2;
  bool unread_only = 3;
}

message ListResponse {
  repeated NotificationDTO notifications = 1;
  int32 unread_count = 2;   // ALWAYS a fresh count
  int32 page = 3;
  int32 page_size = 4;
  int32 total = 5;
}

message MarkReadRequest {
  string notification_id = 1;
  int64 seq_no = 2;             // 0 = server picks current+1 (backward-compat default)
}
message MarkAllReadRequest {}
message MarkReadResponse {
  int32 unread_count = 1;       // fresh post-ack count
  int64 accepted_seq_no = 2;   // monotonic high-water mark after this ack
}
