syntax = "proto3";

package admin.profile.v1;

// ProfileService — candidate profile + resume. Auth via `authorization` metadata;
// the caller's identity (from the access token) is the profile owner.
service ProfileService {
  rpc UploadResume(UploadResumeRequest) returns (ProfileResponse);
  rpc GetProfile(GetProfileRequest) returns (ProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (ProfileResponse);
}

message ExperienceItem {
  string company = 1;
  string title = 2;
  string summary = 3;
}

message EducationItem {
  string institution = 1;
  string degree = 2;
  string year = 3;
}

message UpdateProfileRequest {
  string full_name = 1;
  int32 age = 2;
  string location = 3;
  bool willing_to_relocate = 4;
  string job_preference = 5;  // hybrid | remote | onsite
  // AI-parsed resume data the candidate reviews/edits (full-replace; UI round-trips).
  repeated ExperienceItem experience = 6;
  repeated EducationItem education = 7;
  repeated string skills = 8;
}

message UploadResumeRequest {
  bytes data = 1;
  string content_type = 2;
}

message GetProfileRequest {}

message ProfileResponse {
  string user_id = 1;
  bool resume_uploaded = 2;
  bool parsed = 3;
  bool confirmed = 4;
  int32 completeness = 5;
  string full_name = 6;
  int32 age = 7;
  string location = 8;
  bool willing_to_relocate = 9;
  string job_preference = 10;
  repeated ExperienceItem experience = 11;
  repeated EducationItem education = 12;
  repeated string skills = 13;
}
