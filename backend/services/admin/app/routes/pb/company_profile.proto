syntax = "proto3";

package admin.company_profile.v1;

// CompanyProfileService — public read of an employer's branding + trust signals, plus
// the company-admin branding write. GetCompanyProfile is an UNAUTHENTICATED read of a
// published company (the public REST mirror shares the resource); the write RPCs are
// branding:edit-gated (company_admin only) and comp-scoped from the token.
service CompanyProfileService {
  rpc GetCompanyProfile(GetCompanyProfileRequest) returns (CompanyProfile);
  rpc UpsertCompanyProfile(UpsertCompanyProfileRequest) returns (CompanyProfile);
  rpc PresignLogoUpload(PresignLogoUploadRequest) returns (PresignLogoUploadResponse);
}

message UpsertCompanyProfileRequest {
  string about = 1;
  string website = 2;
  string logo = 3;  // the object_key from PresignLogoUpload, or "" to clear
  repeated string locations = 4;
}

message PresignLogoUploadRequest {
  string content_type = 1;  // image/png | image/jpeg | image/webp
}

message PresignLogoUploadResponse {
  string upload_url = 1;   // PUT the file here
  string object_key = 2;   // echo back as UpsertCompanyProfileRequest.logo
}

message GetCompanyProfileRequest {
  string comp_id = 1;
}

message CompanyProfile {
  string id = 1;                  // public company id (maps from internal comp_id)
  string name = 2;
  string about = 3;               // "" when unset
  string website = 4;             // "" when unset
  string logo = 5;                // logo URL or ""
  repeated string locations = 6;
  TrustSignals trust = 7;
}

// Computed from funnel ground-truth (application transition timings) — never self-reported.
message TrustSignals {
  bool actively_reviewing = 1;
  int32 responds_in_days = 2;   // 0 below min-sample -> FE hides the chip
  int32 open_jobs = 3;
}
