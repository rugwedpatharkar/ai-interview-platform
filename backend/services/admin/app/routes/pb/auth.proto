syntax = "proto3";

package admin.auth.v1;

// AuthService — identity + session for company users and candidates.
// Routes are thin: each RPC just calls an app/resources function.
service AuthService {
  rpc RegisterCompany(RegisterCompanyRequest) returns (UserResponse);
  rpc RegisterCandidate(RegisterCandidateRequest) returns (UserResponse);
  rpc Verify(VerifyRequest) returns (UserResponse);
  rpc Login(LoginRequest) returns (TokenResponse);
  // When the account has 2FA on, Login returns mfa_required + a single-use mfa_token
  // (no access/refresh); the client completes via VerifyTotpLogin (TOTP or recovery).
  rpc VerifyTotpLogin(VerifyTotpLoginRequest) returns (TokenResponse);
  rpc Refresh(RefreshRequest) returns (TokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc InviteRecruiter(InviteRecruiterRequest) returns (UserResponse);
  rpc ForgotPassword(ForgotPasswordRequest) returns (OkResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (OkResponse);
  rpc ResendVerification(ResendVerificationRequest) returns (OkResponse);
  rpc Me(MeRequest) returns (IdentityResponse);
  rpc ListOAuthProviders(ListOAuthProvidersRequest) returns (OAuthProvidersResponse);
}

message RegisterCompanyRequest {
  string company_name = 1;
  string email = 2;
  string password = 3;
}

message RegisterCandidateRequest {
  string email = 1;
  string password = 2;
}

message VerifyRequest {
  string token = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message MeRequest {}

message UserResponse {
  string id = 1;
  string email = 2;
  string role = 3;
  string comp_id = 4;  // empty for candidates
  bool email_verified = 5;
}

message TokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  // Additive: false/"" (proto defaults) for a normal 2FA-off login — the wire
  // response stays byte-for-byte identical. Set only when 2FA is required.
  bool mfa_required = 4;
  string mfa_token = 5;
}

message VerifyTotpLoginRequest {
  string mfa_token = 1;
  string code = 2;  // a TOTP code or an unused recovery code
}

message IdentityResponse {
  string id = 1;
  string role = 2;
  string comp_id = 3;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  bool ok = 1;
}

message InviteRecruiterRequest {
  string email = 1;
  string password = 2;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResendVerificationRequest {
  string email = 1;
}

message ListOAuthProvidersRequest {}

message OAuthProvidersResponse {
  repeated string providers = 1;  // sorted, configured SSO provider names
}

message OkResponse {
  bool ok = 1;
}
