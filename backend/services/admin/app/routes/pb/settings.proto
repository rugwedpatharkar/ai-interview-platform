syntax = "proto3";

package admin.settings.v1;

// SettingsService — self-scoped account settings (the caller is the token; no request
// carries a target user_id). This slice ships notification preferences; sessions / 2FA /
// password+email change land additively on the same service.
service SettingsService {
  rpc GetNotificationPrefs(GetNotificationPrefsRequest) returns (NotificationPrefs);
  rpc SetNotificationPrefs(NotificationPrefs) returns (NotificationPrefs);
  // 2FA (TOTP). SetupTotp stages an encrypted secret; VerifyTotp enables + returns
  // one-time recovery codes; DisableTotp takes a TOTP code OR a recovery code.
  rpc SetupTotp(SetupTotpRequest) returns (SetupTotpResponse);
  rpc VerifyTotp(VerifyTotpRequest) returns (VerifyTotpResponse);
  rpc DisableTotp(DisableTotpRequest) returns (OkResponse);
  // Password + email change (self-scoped). VerifyEmailChange is pre-auth (the link is
  // the proof); a single-use nonce blocks replay.
  rpc ChangePassword(ChangePasswordRequest) returns (OkResponse);
  rpc RequestEmailChange(RequestEmailChangeRequest) returns (OkResponse);
  rpc VerifyEmailChange(VerifyEmailChangeRequest) returns (OkResponse);
  // Active refresh sessions (devices). RevokeSession of a jti not in the caller's set
  // is NOT_FOUND; RevokeAllSessions keeps the current device (logout-everywhere-else).
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (OkResponse);
  rpc RevokeAllSessions(RevokeAllSessionsRequest) returns (OkResponse);
}

message ListSessionsRequest {}
message SessionDTO {
  string jti = 1;
  string ip = 2;
  string user_agent = 3;
  string created_at = 4;  // ISO
  string last_seen = 5;   // ISO
  bool current = 6;       // the caller's own device
}
message ListSessionsResponse {
  repeated SessionDTO sessions = 1;
}
message RevokeSessionRequest {
  string jti = 1;
}
message RevokeAllSessionsRequest {}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}
message RequestEmailChangeRequest {
  string new_email = 1;
  // Required: the caller's current password. A stolen access token alone must not
  // be enough to move the account to an attacker-controlled inbox.
  string current_password = 2;
}
message VerifyEmailChangeRequest {
  string token = 1;
}

message SetupTotpRequest {}
message SetupTotpResponse {
  string provisioning_uri = 1;  // otpauth:// for the authenticator QR
  string secret = 2;            // raw base32, shown once
}
message VerifyTotpRequest {
  string code = 1;
}
message VerifyTotpResponse {
  bool enabled = 1;
  repeated string recovery_codes = 2;  // plaintext, shown once
}
message DisableTotpRequest {
  string code = 1;  // a current TOTP code or an unused recovery code
}
message OkResponse {
  bool ok = 1;
}

message QuietHours {
  string start = 1;  // "HH:MM"
  string end = 2;    // "HH:MM"
  string tz = 3;     // IANA tz, e.g. "Europe/Berlin"
}

message GetNotificationPrefsRequest {}

message NotificationPrefs {
  map<string, bool> email_categories = 1;  // category -> enabled
  bool sms_critical = 2;
  string digest = 3;                        // off | daily | weekly
  QuietHours quiet_hours = 4;               // absent = no quiet hours
}
