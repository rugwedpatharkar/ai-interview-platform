[project]
name = "ai-agents"
version = "0.1.0"
description = "AI service (Gemini + LiveKit voice worker) for the interview platform"
requires-python = ">=3.12"
dependencies = [
    "lib",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4",
    "pydantic>=2",
    "langchain-google-genai>=2",
    "mcp>=1.28.1",  # 1.28.0 has CVE-2026-59950
    "pypdf>=4",
    "python-docx>=1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "livekit-api>=1.1.0",
    "livekit==1.1.9",
    "onnxruntime>=1.18",
    "groq>=1.4.0",
    "edge-tts>=7.2.0",
    "av>=14.0",
    "numpy>=1.26",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
