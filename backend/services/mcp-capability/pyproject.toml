[project]
name = "mcp-capability"
version = "0.1.0"
description = "MCP server — document parsing capability (resume -> text)"
requires-python = ">=3.12"
dependencies = [
    "lib",
    "mcp>=1.28.1",  # 1.28.0 has CVE-2026-59950
    "pypdf>=4",
    "python-docx>=1",
    "qdrant-client>=1.7",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
