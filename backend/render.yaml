# Render Blueprint — consolidated Aptura backend (one container, all 4 services + nginx).
# Render → New → Blueprint → point at this repo; it reads this file. Secret VALUES are
# NEVER in git: every env var below is `sync: false`, meaning you paste it once in the
# Render dashboard (or bulk-paste a .env — see backend/.env.example).
#
# Databases live OUTSIDE this container (all free, no credit card): MongoDB Atlas, Upstash
# Redis, CloudAMQP RabbitMQ, Qdrant Cloud. This container is just the stateless app tier.
#
# Memory: the 4 Python services idle ~360 MB; Render free = 512 MB → ~130 MB headroom.
# Fine for a demo / single-tester. Under sustained multi-user load it may OOM-restart —
# bump to the Starter instance ($7/mo, 512 MB→2 GB) when you have real traffic.
services:
  - type: web
    name: aptura-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon          # free tier; change to frankfurt/singapore/ohio if closer
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # --- Secrets / connection strings (set in dashboard; never committed) ---
      - key: JWT_SECRET            # `openssl rand -hex 32`
        sync: false
      - key: MONGO_URI            # Atlas: mongodb+srv://…?retryWrites=true&w=majority
        sync: false
      - key: REDIS_URL            # Upstash: rediss://default:…@….upstash.io:6379
        sync: false
      - key: RABBITMQ_URL         # CloudAMQP: amqps://…@….cloudamqp.com/…
        sync: false
      - key: GEMINI_API_KEY       # aistudio.google.com/apikey
        sync: false
      - key: QDRANT_URL           # Qdrant Cloud: https://….cloud.qdrant.io:6333
        sync: false
      - key: QDRANT_API_KEY       # Qdrant Cloud cluster API key
        sync: false
      - key: CORS_ALLOW_ORIGIN    # your Vercel URL, e.g. https://aptura.vercel.app
        sync: false
      # Shared bearer secret for the internal MCP endpoints (mcp-data, mcp-capability).
      # `openssl rand -hex 32`. ai-agents sends it as `Authorization: Bearer <secret>`;
      # the MCP servers refuse any request without a matching header. Belt-and-braces on
      # top of the loopback-only routing in nginx.conf.template.
      - key: MCP_SHARED_SECRET
        sync: false
      # --- Object storage (Cloudflare R2, S3-compatible) ---
      - key: S3_ENDPOINT_URL      # https://<account-id>.r2.cloudflarestorage.com
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        value: interview-platform
      - key: S3_REGION
        value: auto
      # --- Email (Gmail direct — Path A) — required for verification / reset emails.
      # 2FA on aptura0ai@gmail.com + a Google App Password from
      # myaccount.google.com/apppasswords. Cap ~500 emails/day (personal Gmail).
      # For higher volume switch SMTP_HOST to smtp.resend.com and set SMTP_USER=resend.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: aptura0ai@gmail.com
      - key: SMTP_PASS            # 16-char Google App Password (spaces optional)
        sync: false
      - key: SMTP_FROM
        value: aptura0ai@gmail.com
      # --- Runtime posture ---
      # Marks this as a production deployment. The lib.config sentinel validator refuses
      # to start when a known dev-only secret (JWT_SECRET, LIVEKIT_API_SECRET) matches
      # its docker-compose default — set this OR pay for it later.
      - key: ENVIRONMENT
        value: prod
      # Trust the bundled nginx to set X-Forwarded-For; otherwise every request looks
      # like 127.0.0.1 and per-IP rate limits collapse into a shared global limit.
      - key: TRUSTED_PROXY
        value: "1"
      # OTLP collector endpoint (Grafana Cloud, Honeycomb, self-hosted otel-collector).
      # Empty = InMemorySpanExporter (spans dropped). Set it to actually see traces.
      - key: OTLP_ENDPOINT
        sync: false
      # Voice-mode interview via LiveKit + Groq. Off by default (~+90 MB memory + needs
      # LIVEKIT_* + GROQ_API_KEY). Set to "1" to boot the voice-worker program.
      - key: VOICE_ENABLED
        value: "0"
      - key: LIVEKIT_URL          # wss://... your LiveKit Cloud / self-hosted URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET   # >=32 chars; the dev sentinel is refused at boot
        sync: false
      - key: GROQ_API_KEY
        sync: false
