# Daily Mongo → R2 backup for the Render / Shape-B deploys (Atlas M0 has no built-in
# backups). Runs on a cron at 07:00 UTC; also runnable ad-hoc via workflow_dispatch.
#
# Required repo secrets (set in Settings → Secrets and variables → Actions):
#   MONGO_URI              — full mongodb+srv://user:pw@host/?... connection string
#   R2_ENDPOINT_URL        — https://<account-id>.r2.cloudflarestorage.com
#   R2_ACCESS_KEY_ID       — R2 API token (backup-scoped)
#   R2_SECRET_ACCESS_KEY   — R2 API token secret
#   R2_BACKUP_BUCKET       — target bucket name (e.g. aptura-backups)
#
# Retention: 14 daily snapshots kept via the R2 bucket lifecycle rule (configure at the
# bucket, not here). Restore: `mongorestore --uri="$MONGO_URI" ./dump`.

name: mongo-backup
on:
  schedule:
    - cron: "0 7 * * *"   # daily 07:00 UTC
  workflow_dispatch:       # manual trigger

jobs:
  dump-and-upload:
    if: ${{ vars.MONGO_BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install mongodump + s3cmd
        run: |
          set -euo pipefail
          wget -qO- https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.10.0.tgz | tar xz
          sudo mv mongodb-database-tools-*/bin/mongodump /usr/local/bin/mongodump
          sudo apt-get update && sudo apt-get install -y s3cmd

      - name: mongodump → gzip → R2
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          out="mongo-${stamp}.archive.gz"
          mongodump --uri="$MONGO_URI" --archive="$out" --gzip
          # s3cmd hostname needs the r2 endpoint stripped of scheme.
          host="${R2_ENDPOINT_URL#https://}"
          s3cmd --access_key="$R2_ACCESS_KEY_ID" --secret_key="$R2_SECRET_ACCESS_KEY" \
                --host="$host" --host-bucket="%(bucket)s.$host" \
                --no-ssl-check put "$out" "s3://$R2_BACKUP_BUCKET/$out"
          echo "uploaded s3://$R2_BACKUP_BUCKET/$out"
